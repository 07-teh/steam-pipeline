name: Fetch Steam player counts

on:
  schedule:
    - cron: "13 0-23/3 1-31/3 * *"
    - cron: "13 1-23/3 2-31/3 * *"
    - cron: "13 2-23/3 3-31/3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch player counts
        run: python fetch_players.py

      - name: Commit updated database
        if: ${{!cancelled()}}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add steam.db
          git diff --staged --quiet || git commit -m "Data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        

